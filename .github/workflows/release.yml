# Release stub: runs on v0.x.y tags. Publishing is skipped until the
# CARGO_REGISTRY_TOKEN / NPM_TOKEN secrets exist. Downstream repos depend on
# these tagged releases only, never on main.
name: release

on:
  push:
    tags: ["v0.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: cargo test --workspace
      - name: Publish assay-stellar
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p assay-stellar
      - name: Skip (no token)
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"

  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Publish @garkuwa/assay-sdk
        if: env.NODE_AUTH_TOKEN != ''
        run: pnpm --filter @garkuwa/assay-sdk publish --no-git-checks --provenance
      - name: Skip (no token)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN not set; skipping npm publish"

  github-release:
    needs: [crates, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --notes "See CHANGELOG.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
