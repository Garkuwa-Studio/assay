[package]
name = "assay-stellar"
description = "Assay CLI: check reserve status and sign/post reserve reports on Stellar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["stellar", "soroban", "proof-of-reserves", "rwa"]
